<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>VideoBlitzer Crop Frame</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .frame { position:fixed; inset:0; border:4px solid #22d3ee; border-radius:18px; box-shadow:0 0 0 1px rgba(255,255,255,.75) inset, 0 0 34px rgba(34,211,238,.55); background:rgba(34,211,238,.035); }
    .frame::before, .frame::after { content:""; position:absolute; left:0; right:0; border-top:1px dashed rgba(255,255,255,.55); pointer-events:none; }
    .frame::before { top:33.333%; }
    .frame::after { top:66.666%; }
    .dragbar { -webkit-app-region:drag; position:absolute; left:14px; top:14px; right:14px; height:34px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:white; font-weight:900; font-size:12px; letter-spacing:.04em; text-transform:uppercase; }
    .badge { background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:7px 10px; box-shadow:0 12px 34px rgba(0,0,0,.2); }
    .hint { color:rgba(255,255,255,.86); text-transform:none; letter-spacing:0; font-weight:800; }
    .locked .hint { color:#fbbf24; }
  </style>
</head>
<body>
  <div id="frame" class="frame">
    <div class="dragbar"><span id="aspect" class="badge">16:9</span><span id="hint" class="badge hint">Drag frame edges to resize</span></div>
  </div>
  <script>
    const update = (state) => {
      document.getElementById("aspect").textContent = state?.aspect || "16:9";
      document.getElementById("frame").classList.toggle("locked", Boolean(state?.locked));
      document.getElementById("hint").textContent = state?.locked ? "Locked for click-through" : "Drag frame or resize edges";
    };
    window.videoBlitzerRecorder?.getCropOverlayState?.().then(update).catch(() => undefined);
    window.videoBlitzerRecorder?.onCropOverlayState?.(update);
  </script>
</body>
</html>
